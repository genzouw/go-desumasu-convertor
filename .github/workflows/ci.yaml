name: CI
on:
  - push
  - workflow_dispatch
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.14.x
      - name: Make
        run: make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desumasu-convertor
          path: desumasu-convertor
